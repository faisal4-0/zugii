<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Change Password - ZUGI</title>
	<link rel="stylesheet" href="registration.css">
	
</head>
<body>
<h2>Change Password</h2>

<form action="#" method="post" data-disabled>

Current Password:
<br>
<input type="password" name="current_password">
<br>
<br>
New Password:
<br>
<input type="password" name="new_password">
<br>
<br>
Confirm Password:
<br>
<input type="password" name="confirm_password">
<br>
<br>
<input type="submit" name="submit" value="Change Password">

</form>
<p><a href="fetch.html">&larr; Back to users</a></p>
<script>
document.addEventListener('DOMContentLoaded', function () {
	document.querySelectorAll('form[data-disabled]').forEach(function (form) {
		form.addEventListener('submit', function (e) {
			e.preventDefault();
			alert('This is a static demo site — this form is not connected to a database, so nothing is actually submitted.');
		});
	});
});
</script>
</body>
</html>
