<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Edit User - ZUGI</title>
	<link rel="stylesheet" href="CSS/registration.css">
	
</head>
<body>
<h2>Edit User</h2>

<form action="#" method="post" data-disabled>

<input type="text" name="name" placeholder="Name">
<br>
<br>
<input type="text" name="email" placeholder="Email">
<br>
<br>
<input type="text" name="password" placeholder="Password">
<br>
<br>
<input type="submit" name="submit">

</form>
<p><a href="fetch.html">&larr; Back to users</a></p>
<script>
document.addEventListener('DOMContentLoaded', function () {
	document.querySelectorAll('form[data-disabled]').forEach(function (form) {
		form.addEventListener('submit', function (e) {
			e.preventDefault();
			alert('This is a static demo site — this form is not connected to a database, so nothing is actually submitted.');
		});
	});
});
</script>
</body>
</html>
