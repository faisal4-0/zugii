<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registered Users - ZUGI</title>
	<link rel="stylesheet" href="registration.css">
	
</head>
<body>
<h2>Registered Users</h2>

<table>

	<tr>

		<th>ID</th>
		<th>Name</th>
		<th>Email</th>
		<th>Password</th>
		<th>Edit</th>
		<th>Delete</th>
		<th>Change Password</th>

	</tr>
	<tr>
		<td colspan="7" style="text-align:center;">No data available — this is a static demo with no connected database.</td>
	</tr>

</table>
<p><a href="index.html">&larr; Back to home</a></p>
<script>
document.addEventListener('DOMContentLoaded', function () {
	document.querySelectorAll('form[data-disabled]').forEach(function (form) {
		form.addEventListener('submit', function (e) {
			e.preventDefault();
			alert('This is a static demo site — this form is not connected to a database, so nothing is actually submitted.');
		});
	});
});
</script>
</body>
</html>
