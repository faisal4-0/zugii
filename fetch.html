<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registered Users - ZUGI</title>
	<style>
body{
	font-family: Arial, sans-serif;
	background-color: #f4f4f4;
	color: #333;
	margin: 0;
	padding: 20px;
}

h2{
	text-align: center;
}

table{
	width: 90%;
	margin: 20px auto;
	border-collapse: collapse;
	background-color: #fff;
}

table, th, td{
	border: 1px solid #ccc;
}

th, td{
	padding: 10px;
	text-align: center;
}

th{
	background-color: #333;
	color: #fff;
}

tr:nth-child(even){
	background-color: #f9f9f9;
}

a{
	text-decoration: none;
	color: #fff;
	padding: 5px 10px;
	border-radius: 3px;
}

a[href^="edit"]{
	background-color: #2196F3;
}

a[href^="delete"]{
	background-color: #f44336;
}

a[href^="change_password"]{
	background-color: #ff9800;
}

form{
	width: 300px;
	margin: 30px auto;
	background-color: #fff;
	padding: 20px;
	border: 1px solid #ccc;
	border-radius: 5px;
}

input[type="text"],
input[type="email"],
input[type="password"]{
	width: 100%;
	padding: 8px;
	margin-bottom: 15px;
	border: 1px solid #ccc;
	border-radius: 3px;
	box-sizing: border-box;
}

input[type="submit"],
button{
	width: 100%;
	padding: 10px;
	background-color: #333;
	color: #fff;
	border: none;
	border-radius: 3px;
	cursor: pointer;
}

input[type="submit"]:hover,
button:hover{
	background-color: #555;
}

.search-box{
	text-align: center;
	margin-bottom: 20px;
}

.search-box input[type="text"]{
	width: 250px;
	display: inline-block;
	margin-bottom: 0;
}

.search-box button{
	width: auto;
	display: inline-block;
	padding: 8px 15px;
}

	</style>
</head>
<body>
<h2>Registered Users</h2>

<table>

	<tr>

		<th>ID</th>
		<th>Name</th>
		<th>Email</th>
		<th>Password</th>
		<th>Edit</th>
		<th>Delete</th>
		<th>Change Password</th>

	</tr>
	<tr>
		<td colspan="7" style="text-align:center;">No data available — this is a static demo with no connected database.</td>
	</tr>

</table>
<p><a href="index.html">&larr; Back to home</a></p>
<script>
	// ---- Cart (localStorage-based, replaces PHP sessions) ----
	function getCart(){
		try { return JSON.parse(localStorage.getItem('zugi_cart') || '{}'); } catch(e){ return {}; }
	}
	function setCart(cart){
		localStorage.setItem('zugi_cart', JSON.stringify(cart));
	}
	function addToCart(id, qty){
		qty = Math.max(1, parseInt(qty) || 1);
		var cart = getCart();
		cart[id] = (cart[id] || 0) + qty;
		setCart(cart);
	}
	function updateCartCount(){
		var cart = getCart();
		var total = 0;
		Object.keys(cart).forEach(function(k){ total += cart[k]; });
		var el = document.getElementById('cart-count');
		if (el) el.textContent = total;
	}
	updateCartCount();

	// Catch "ADD TO CART" submits from any page, including ones injected later by JS
	document.addEventListener('submit', function(e){
		var form = e.target;
		if (!form.classList) return;
		if (form.classList.contains('quick-add-form') || form.classList.contains('add-to-cart-form')){
			e.preventDefault();
			var idInput = form.querySelector('input[name="id"]');
			var qtyInput = form.querySelector('input[name="qty"]');
			if (idInput){
				addToCart(idInput.value, qtyInput ? qtyInput.value : 1);
				window.location.href = 'cart.html';
			}
		}
	});

	// Non-functional demo forms (registration / edit / change password / login)
	document.addEventListener('DOMContentLoaded', function () {
		document.querySelectorAll('form[data-disabled]').forEach(function (form) {
			form.addEventListener('submit', function (e) {
				e.preventDefault();
				alert('This is a static demo site — this form is not connected to a database, so nothing is actually submitted.');
			});
		});
	});

	// ---- Dark / light mode ----
	document.addEventListener('DOMContentLoaded', function () {
	const themeBtn = document.getElementById('theme-toggle');
	const body = document.body;

	if (localStorage.getItem('theme') === 'dark') {
		body.classList.add('dark-mode');
	}

	if (themeBtn) themeBtn.addEventListener('click', function(){
		body.classList.toggle('dark-mode');
		localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
	});

	// ---- Accent color picker ----
	const colorBtn = document.getElementById('color-picker-btn');
	const colorPanel = document.getElementById('color-picker-panel');
	const swatches = document.querySelectorAll('.color-swatch');

	function setAccent(color){
		document.documentElement.style.setProperty('--accent', color);
		localStorage.setItem('accentColor', color);
		swatches.forEach(function(s){
			s.classList.toggle('active', s.dataset.color === color);
		});
	}

	const savedAccent = localStorage.getItem('accentColor');
	if (savedAccent) {
		setAccent(savedAccent);
	}

	if (colorBtn) colorBtn.addEventListener('click', function(e){
		e.stopPropagation();
		colorPanel.classList.toggle('open');
	});

	swatches.forEach(function(s){
		s.addEventListener('click', function(){
			setAccent(s.dataset.color);
			colorPanel.classList.remove('open');
		});
	});

	// ---- Search widget ----
	const searchBtn = document.getElementById('search-btn');
	const searchPanel = document.getElementById('search-panel');
	const searchInput = document.getElementById('search-input');

	if (searchBtn) searchBtn.addEventListener('click', function(e){
		e.stopPropagation();
		searchPanel.classList.toggle('open');
		if (searchPanel.classList.contains('open')) {
			searchInput.focus();
		}
	});

	document.addEventListener('click', function(e){
		if (colorPanel && !colorPanel.contains(e.target) && e.target !== colorBtn) {
			colorPanel.classList.remove('open');
		}
		if (searchPanel && !searchPanel.contains(e.target) && e.target !== searchBtn && !searchBtn.contains(e.target)) {
			searchPanel.classList.remove('open');
		}
	});

	// ---- Scroll reveal ----
	const revealSelector = '.product-card, .shop-title, .cart-item, .cart-total, .product-detail, .content .txt, .content .txt2, .content .image, .t1, .t2, .t3, .text, .text2';
	const revealItems = document.querySelectorAll(revealSelector);

	const revealObserver = new IntersectionObserver(function(entries, observer){
		entries.forEach(function(entry){
			if (entry.isIntersecting) {
				entry.target.classList.add('in-view');
				observer.unobserve(entry.target);
			}
		});
	}, { threshold: 0.15 });

	revealItems.forEach(function(item){
		revealObserver.observe(item);
	});
	});
</script>

</body>
</html>
