<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign Up - ZUGI</title>
	<link rel="stylesheet" href="CSS/registration.css">
	
</head>
<body>
<h2>Sign Up</h2>

<form action="#" method="post" data-disabled>

Name:
<br>
<input type="text" name="name" required>
<br>
<br>
Email:
<br>
<input type="email" name="email">
<br>
<br>
Password:
<br>
<input type="password" name="password">
<br>
<br>
Repeat Password:
<br>
<input type="password" name="re-password">
<br>
<br>
<input type="submit" name="submit" value="Register">

</form>
<p><a href="index.html">&larr; Back to home</a></p>
<script>
document.addEventListener('DOMContentLoaded', function () {
	document.querySelectorAll('form[data-disabled]').forEach(function (form) {
		form.addEventListener('submit', function (e) {
			e.preventDefault();
			alert('This is a static demo site — this form is not connected to a database, so nothing is actually submitted.');
		});
	});
});
</script>
</body>
</html>
